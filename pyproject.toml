[project]
name = "kanji-converter"
version = "0.1.0"
description = "A small application to determine likely kanji readings of a Japanese sentence written entirely in haragana."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "eel>=0.18.2",
    "kenlm>=0.3.0",
    "mecab-python3>=1.0.10",
    "ruff>=0.14.0",
    "sudachidict-core>=20250825",
    "sudachipy>=0.6.10",
    "unidic-lite>=1.0.8",
]
